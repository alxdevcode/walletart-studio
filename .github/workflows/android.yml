name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build web application
        run: bun run build

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Update Android app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          strings = Path("android/app/src/main/res/values/strings.xml")
          tree = ET.parse(strings)
          root = tree.getroot()

          for element in root.findall("string"):
              if element.get("name") == "app_name":
                  element.text = "Wallet Demo"

          tree.write(strings, encoding="utf-8", xml_declaration=True)
          PY

      - name: Generate Android icons
        run: |
          if [ -f assets/icon-only.png ]; then
            bunx @capacitor/assets generate --android
          else
            echo "assets/icon-only.png not found"
            exit 1
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wallet-demo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
